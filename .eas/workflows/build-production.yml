# Builds the Play Store bundle (.aab) on Expo's servers.
# Runs when you push to the `production` branch. Download the .aab from
# expo.dev and upload it in Play Console, or add a `submit` job once a
# Google service account key is set up in the Expo dashboard.
name: Build Play Store bundle

on:
  push:
    branches: ['production']

jobs:
  build_android:
    name: Build Android AAB
    type: build
    params:
      platform: android
      profile: production
